# When BillFlow should open itself.
#
# Change any value here, then re-run:   npm run app:install
#
# ANCHOR_DATE is a date the app SHOULD open. Everything is counted from it, so
# the weekday of the schedule comes from this date -- set it to a Tuesday and
# it becomes a Tuesday schedule. Set it to a date in your own invoicing cycle.
ANCHOR_DATE=2026-01-10

# 1 = every week, 2 = every second week, 4 = every fourth, and so on.
INTERVAL_WEEKS=2

# 24-hour local time.
LAUNCH_TIME=14:30
